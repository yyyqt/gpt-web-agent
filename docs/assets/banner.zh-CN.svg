<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="GPT Web Agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif">
    <text x="640" y="118" text-anchor="middle" font-size="64" font-weight="700" fill="#f8fafc">GPT Web Agent</text>
    <rect x="560" y="140" width="160" height="4" rx="2" fill="url(#accent)"/>
    <text x="640" y="190" text-anchor="middle" font-size="26" fill="#cbd5e1">让 ChatGPT 网页版直接改你电脑上的代码、跑测试</text>
    <g font-size="22" text-anchor="middle">
      <rect x="170" y="250" width="260" height="84" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="300" y="286" fill="#f8fafc" font-weight="600">ChatGPT 网页</text>
      <text x="300" y="316" fill="#94a3b8" font-size="17">负责思考和决策</text>
      <line x1="440" y1="292" x2="500" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="510" y="250" width="260" height="84" rx="16" fill="#1e293b" stroke="#334155"/>
      <text x="640" y="286" fill="#f8fafc" font-weight="600">私有隧道</text>
      <text x="640" y="316" fill="#94a3b8" font-size="17">OpenAI 官方加密通道</text>
      <line x1="780" y1="292" x2="840" y2="292" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="850" y="250" width="260" height="84" rx="16" fill="#0f2f2a" stroke="#34d399"/>
      <text x="980" y="286" fill="#f8fafc" font-weight="600">你的电脑</text>
      <text x="980" y="316" fill="#6ee7b7" font-size="17">读写文件、运行命令</text>
    </g>
  </g>
</svg>
